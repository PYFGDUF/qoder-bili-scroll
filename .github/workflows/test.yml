name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m venv "$HOME/.qoder-bili-scroll/.venv"
          "$HOME/.qoder-bili-scroll/.venv/bin/python" -m pip install --upgrade pip
          "$HOME/.qoder-bili-scroll/.venv/bin/python" -m pip install -r vendor/bilibili-mcp/requirements.txt

      - name: Run tests
        run: ./scripts/test.sh
